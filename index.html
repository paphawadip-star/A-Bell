<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR Musical Instruments - Mobile</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        /* ส่วนที่ 2: ตกแต่งปุ่มให้กดง่ายบนมือถือ (เกณฑ์ความสวยงาม) */
        .ui-container {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 1000; width: 90%; justify-content: center;
        }
        button {
            padding: 15px 12px; border-radius: 15px; border: 2px solid white;
            background: rgba(0,0,0,0.8); color: white; cursor: pointer; 
            font-size: 14px; flex: 1; font-weight: bold;
        }
        button:active { background: #FF5722; transform: scale(0.95); }
        .info-panel {
            position: fixed; top: 10px; left: 10px; right: 10px; color: white;
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px; z-index: 1000;
            text-align: center; pointer-events: none;
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="info-panel">
        <h2 id="inst-title" style="margin:0;">🎹 Piano</h2>
        <p id="inst-desc" style="margin:5px 0 0 0; font-size: 14px;">แตะปุ่มด้านล่างเพื่อเปลี่ยนเครื่องดนตรี</p>
    </div>

    <div class="ui-container">
        <button onclick="switchInstrument('piano')">🎹<br>Piano</button>
        <button onclick="switchInstrument('guitar')">🎸<br>Guitar</button>
        <button onclick="switchInstrument('drum')">🥁<br>Drum</button>
    </div>

    <a-scene 
        embedded 
        arjs="sourceType: webcam; debugUIEnabled: false; displayWidth: 1280; displayHeight: 720;"
        vr-mode-ui="enabled: false">
        
        <a-marker preset="hiro">
            <a-entity id="piano-group" visible="true">
                <a-box position="0 0.5 0" scale="1 0.6 0.5" color="#333"></a-box>
                <a-box position="0 0.7 0.2" scale="0.9 0.1 0.2" color="#EEE"></a-box>
            </a-entity>

            <a-entity id="guitar-group" visible="false">
                <a-cylinder position="0 0.5 0" radius="0.3" height="0.1" rotation="90 0 0" color="#8B4513"></a-cylinder>
                <a-box position="0 1 0" scale="0.08 1 0.05" color="#5D4037"></a-box>
            </a-entity>

            <a-entity id="drum-group" visible="false">
                <a-cylinder position="0 0.5 0" radius="0.5" height="0.5" color="#D32F2F"></a-cylinder>
                <a-cylinder position="0 0.76 0" radius="0.52" height="0.05" color="#FFF"></a-cylinder>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // ตรวจสอบกล้องสำหรับมือถือ
        navigator.mediaDevices.getUserMedia({ video: true })
        .catch(function(err) {
            alert("มือถือบล็อกกล้อง! กรุณาใช้ลิงก์ HTTPS หรือกดอนุญาตกล้องใน Chrome/Safari");
        });

        const instruments = {
            piano: { title: "🎹 Piano", desc: "เครื่องลิ่มนิ้วที่สร้างเสียงด้วยการค้อนเคาะสาย" },
            guitar: { title: "🎸 Guitar", desc: "เครื่องสายที่ใช้การดีดหรือใช้นิ้วกรีดสาย" },
            drum: { title: "🥁 Drum", desc: "เครื่องกระทบที่ให้จังหวะหลักในบทเพลง" }
        };

        function switchInstrument(type) {
            // ปิดตัวอื่น เปิดตัวที่เลือก
            document.querySelector('#piano-group').setAttribute('visible', 'false');
            document.querySelector('#guitar-group').setAttribute('visible', 'false');
            document.querySelector('#drum-group').setAttribute('visible', 'false');
            document.querySelector(`#${type}-group`).setAttribute('visible', 'true');

            // เปลี่ยนข้อความบนจอ
            document.getElementById('inst-title').innerText = instruments[type].title;
            document.getElementById('inst-desc').innerText = instruments[type].desc;
        }
    </script>
</body>
</html>
